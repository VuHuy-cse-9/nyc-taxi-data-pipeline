# General configuration
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
fs.native-s3.enabled=true

# Object storage credentials (MinIO)
# WARNING: access-key & secret-key are hardcode
s3.endpoint=http://minio:9000
s3.aws-access-key=minio_access_key
s3.aws-secret-key=minio_secret_key
# bucket-name.s3.amazonaws.com -> s3.amazonaws.com/bucket-name
s3.path-style-access=true
# s3select-pushdown.enabled=true
s3.region=""

# Hive configuration
# Allow users to write
hive.non-managed-table-writes-enabled=false