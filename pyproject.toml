[project]
name = "doan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiokafka>=0.12.0",
    "cassandra-driver>=3.29.2",
    "ipykernel>=6.30.1",
    "minio>=7.2.16",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "pymongo>=4.4.1",
    "pydantic-settings>=2.7.1",
    "psycopg[binary,pool]>=3.2.9",
    "s3fs>=2025.10.0",
    "pyarrow>=16.1.0",
]

# Optional dependencies
[project.optional-dependencies]
spark = [
    "pyspark==4.0.2",
    "apache-airflow==3.0.6",
    "apache-airflow-providers-docker>=4.4.0"
]

feast = [
    "feast[s3,redis]>=0.47.0",
    "sqlalchemy>=2.0"
]

flink = [
    "apache-flink>=2.1.0"
]

[tool.uv]
conflicts = [
    [
      { extra = "spark" },
      { extra = "flink" },
      { extra = "feast" }
    ],
]
