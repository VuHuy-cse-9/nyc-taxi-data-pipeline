services:
  ####################
  #### LAKE HOUSE ####
  ####################
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z-cpuv1
    container_name: lakehouse-minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./local/volumes/minio/data:/data
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    networks:
      - nyc_network

  ########################
  #### HIVE METASTORE ####
  ########################
  metastore_db:
    container_name: hive-metastore-db
    image: postgres:17
    ports:
      - '5433:5432' # Access via Thrift protocol
    environment:
      POSTGRES_USER: '${METADATA_USER}'
      POSTGRES_PASSWORD: '${METADATA_PASSWORD}'
      POSTGRES_DB: "${METADATA_DB}"
    networks:
      - nyc_network
    volumes:
      - ./local/volumes/metastore_db:/var/lib/postgresql/data


  hive-metastore:
    container_name: hive-metastore
    image: 'starburstdata/hive:3.1.3-e.15'
    ports:
      - '9083:9083' # Access via Thrift protocol
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: 'jdbc:postgresql://metastore_db:5432/${METADATA_DB}'
      HIVE_METASTORE_USER: '${METADATA_USER}'
      HIVE_METASTORE_PASSWORD: '${METADATA_PASSWORD}'
      # HIVE_METASTORE_WAREHOUSE_DIR: s3://datalake/ # HDFS config, we don't need it
      # HIVE_METASTORE_USERS_IN_ADMIN_ROLE: "admin" # We also don't need it
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      S3_SECRET_KEY: "${MINIO_SECRET_KEY}"
      S3_PATH_STYLE_ACCESS: "true"
      # Below arguments exist for no reasons, but
      # we can not live without it
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    depends_on:
      - metastore_db
    networks:
      - nyc_network

  ############################
  #### TRINO QUERY ENGINE ####
  ############################
  trino:
    ports:
      - "10000:8080"
    image: "trinodb/trino:476"
    volumes:
      - ./local/trino/etc:/usr/lib/trino/etc:ro
      - ./local/trino/catalog:/etc/trino/catalog
    depends_on:
      - hive-metastore
    networks:
      - nyc_network

  datamart_db:
    container_name: datamart_db
    image: postgres:17
    ports:
      - '5434:5434' # Access via Thrift protocol
    environment:
      POSTGRES_USER: '${DATAMART_USER}'
      POSTGRES_PASSWORD: '${DATAMART_PASSWORD}'
      POSTGRES_DB: "${DATAMART_DB}"
    networks:
      - nyc_network
    volumes:
      - ./local/volumes/datamart_db:/var/lib/postgresql/data
    command: ["postgres", "-c", "port=5434"]

  spark-master:
    build:
      context: local/spark
      dockerfile: Dockerfile
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      MODE: "master"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      METADATA_URI: "thrift://hive-metastore:9083"
      DATAMART_ENDPOINT: "datamart_db"
    networks:
      - nyc_network
    extra_hosts:
      - "host.docker.internal:host-gateway"


  spark-worker:
    build:
      context: local/spark
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      MODE: "worker"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      METADATA_URI: "thrift://hive-metastore:9083"
      DATAMART_ENDPOINT: "datamart_db"
    networks:
      - nyc_network
    depends_on:
      - spark-master
    extra_hosts:
      - "host.docker.internal:host-gateway" 

networks:
  nyc_network:
    driver: bridge