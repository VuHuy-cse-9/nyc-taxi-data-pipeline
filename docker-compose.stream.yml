services:
  ##########################
  #### MESSAGING SYSTEM ####
  ##########################

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.2
    container_name: ms-zookeeper
    ports:
      - 2181:2181
    healthcheck:
      test: echo srvr | nc zookeeper 2181 || exit 1
      start_period: 10s
      retries: 20
      interval: 10s
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - stream_nyc_network

  # Kafka broker, all configurations you can take a look 
  # at https://docs.confluent.io/platform/current/installation/docker/config-reference.html
  broker:
    image: confluentinc/cp-server:7.9.2
    container_name: ms-broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - 9092:9092
      - 9101:9101
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10
    environment:
      # ID of the broker in a cluster
      KAFKA_BROKER_ID: 1
       # Connect to Zoo Keeper for distributed coordination and leader election
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Define how clients connect to brokers
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      # How many copies are maintained for fault tolerance
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Schema Registry URL for storing and managing Avro schemas
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Confluent Metrics Reporter for Control Center Cluster Monitoring
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: 'broker:9092'
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: 'true'
      # For fixing the bug replication factor 3 > the number of node
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - stream_nyc_network

  # For managing Avro schemas
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.2
    container_name: ms-schema-registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    healthcheck:
      start_period: 10s
      interval: 10s
      retries: 20
      test: curl --user superUser:superUser --fail --silent --insecure http://localhost:8081/subjects --output /dev/null || exit 1
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - stream_nyc_network

  # For connecting to offline store
  connect:
    image: confluentinc/cp-kafka-connect:7.9.2
    container_name: ms-connect
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'broker:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: true
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: true
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: '/usr/share/java,/etc/kafka-connect/jars'
    volumes:
      - $PWD/jars/connect_plugins:/etc/kafka-connect/jars
    networks:
      - stream_nyc_network

  # Confluent control center to manage Kafka
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.9.2
    container_name: ms-control-center
    depends_on:
      - broker
      - schema-registry
      - connect
    ports:
      - "9021:9021"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9021/healthcheck"] # Adjust the URL and options as needed
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'
      CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER: 'connect:8083'
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_CONNECT_HEALTHCHECK_ENDPOINT: '/connectors'
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
    networks:
      - stream_nyc_network


  ############################
  #### DEBEZIUM FOR CDC ######
  ############################
  debezium:
    image: debezium/connect:3.0.0.Final
    container_name: cdc-debezium
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--silent',
          '--fail',
          '-X',
          'GET',
          'http://localhost:8083/connectors',
        ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8084:8083"
    environment:
      BOOTSTRAP_SERVERS: broker:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      # Set to Avro for higher performance
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false # Disable schema for JSON converter
      CONNECT_TOPIC_CREATION_ENABLE: true
    volumes:
      - ./jars/debezium_plugins:/kafka/connect/plugins
    networks:
      - stream_nyc_network

  debezium-ui:
    image: debezium/debezium-ui:2.2
    container_name: debezium-ui
    depends_on:
      debezium:
        condition: service_healthy
    ports:
      - '8085:8080'
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    networks:
      - stream_nyc_network

  debezium-init:
    build:
      context: ./local/debezium
    container_name: debezium-init
    depends_on:
      debezium:
        condition: service_healthy
    networks:
      - stream_nyc_network


  ############################
  #### THIRD PARTY TOOLS #####
  ############################
  datasource1:
    image: postgres:15
    container_name: datasource1
    command: ['postgres', '-c', 'wal_level=logical']
    ports:
      - "10001:5432"
    environment:
      - POSTGRES_DB=default
      - POSTGRES_USER=datasource1
      - POSTGRES_PASSWORD=datasource1
    networks:
      - stream_nyc_network


  datasource2:
    image: debezium/example-cassandra:3.1.3.Final
    container_name: datasource2
    build:
      context: ./local/cassandra
    ports:
      - 9042:9042
    networks:
      - stream_nyc_network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' 127.0.0.1 9042 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - cassandra_data:/var/lib/cassandra
    depends_on:
      - zookeeper
      - broker
      - schema-registry

  datasource3:
    image: mongodb/mongodb-community-server:7.0.30-ubi9
    container_name: datasource3
    ports:
      - 27017:27017
    command: >
      mongod --dbpath /data/db --replSet rs0 --port 27017
    volumes:
      - mongodb_data:/data/db
      - ./local/mongodb/init-replica-set.js:/scripts/init-replica-set.js
    healthcheck:
      test: echo 'rs.initiated = rs.status().hasOwnProperty("set") && rs.status().members.length > 0; rs.initiated' | mongo --quiet
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - stream_nyc_network

  datamart_db:
    container_name: datamart_db
    image: postgres:17
    ports:
      - '5434:5432' # Access via Thrift protocol
    environment:
      POSTGRES_USER: '${DATAMART_USER}'
      POSTGRES_PASSWORD: '${DATAMART_PASSWORD}'
      POSTGRES_DB: "${DATAMART_DB}"
    networks:
      - stream_nyc_network
    volumes:
      - ./local/volumes/datamart_db:/var/lib/postgresql/data



  ########################
  #### HIVE METASTORE ####
  # ########################
  trino:
    ports:
      - "10000:8080"
    image: "trinodb/trino:476"
    volumes:
      - ./local/trino/etc:/usr/lib/trino/etc:ro
      - ./local/trino/catalog:/etc/trino/catalog
    depends_on:
      - hive-metastore
    networks:
      - stream_nyc_network


  metastore_db:
    container_name: hive-metastore-db
    image: postgres:17
    ports:
      - '5433:5432' # Access via Thrift protocol
    environment:
      POSTGRES_USER: '${METADATA_USER}'
      POSTGRES_PASSWORD: '${METADATA_PASSWORD}'
      POSTGRES_DB: "${METADATA_DB}"
    networks:
      - stream_nyc_network
    volumes:
      - ./local/volumes/metastore_db:/var/lib/postgresql/data

  hive-metastore:
    container_name: hive-metastore
    image: 'starburstdata/hive:3.1.3-e.15'
    ports:
      - '9083:9083' # Access via Thrift protocol
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: 'jdbc:postgresql://metastore_db:5432/${METADATA_DB}'
      HIVE_METASTORE_USER: '${METADATA_USER}'
      HIVE_METASTORE_PASSWORD: '${METADATA_PASSWORD}'
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    depends_on:
      - metastore_db
    networks:
      - stream_nyc_network



  # GENERATOR
  datasource1_generator:
    build:
      context: ./local/generator/datasource1
    environment:
        DATASOURCE1_HOST: datasource1
        DATASOURCE1_PORT: 5432
        DATASOURCE1_DB: ${DATASOURCE1_DB}
        DATASOURCE1_USER: ${DATASOURCE1_USER}
        DATASOURCE1_PASSWORD: ${DATASOURCE1_PASSWORD}
    volumes:
      - ./dataset/samples/csv:/data
    networks:
      - stream_nyc_network
    depends_on:
      - datasource1

  datasource2_generator:
    build:
      context: ./local/generator/datasource2
    environment:
        DATASOURCE2_HOST: datasource2
    volumes:
      - ./dataset/samples/csv:/data
    networks:
      - stream_nyc_network
    depends_on:
      - datasource2

  datasource3_generator:
    build:
      context: ./local/generator/datasource3
    environment:
        DATASOURCE3_HOST: datasource3
        DATASOURCE3_PORT: 27017
    volumes:
      - ./dataset/samples/csv:/data
    networks:
      - stream_nyc_network
    depends_on:
      - datasource3

networks:
  stream_nyc_network:
    driver: bridge


volumes:
  cassandra_data:
  mongodb_data: